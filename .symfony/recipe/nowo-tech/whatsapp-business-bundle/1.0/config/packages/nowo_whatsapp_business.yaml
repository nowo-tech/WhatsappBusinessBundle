# Named Cloud API profiles. Tokens must come from env vars — never commit them.
nowo_whatsapp_business:
    default_profile: default
    profiles:
        default:
            # transport: cloud (Graph API) or mock (in-memory, demos/tests)
            transport: cloud
            phone_number_id: '%env(WHATSAPP_PHONE_NUMBER_ID)%'
            access_token: '%env(WHATSAPP_ACCESS_TOKEN)%'
            whatsapp_business_account_id: '%env(default::WHATSAPP_BUSINESS_ACCOUNT_ID)%'
            app_secret: '%env(default::WHATSAPP_APP_SECRET)%'
            webhook_verify_token: '%env(default::WHATSAPP_WEBHOOK_VERIFY_TOKEN)%'
            graph_version: 'v21.0'
            timeout: 10.0
            connect_timeout: 5.0
            allow_unsigned_webhooks: false
