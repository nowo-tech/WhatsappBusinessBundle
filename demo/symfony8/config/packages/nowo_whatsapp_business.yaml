nowo_whatsapp_business:
    default_profile: default
    profiles:
        default:
            transport: mock
            phone_number_id: '%env(WHATSAPP_PHONE_NUMBER_ID)%'
            access_token: '%env(WHATSAPP_ACCESS_TOKEN)%'
            whatsapp_business_account_id: '%env(default::WHATSAPP_BUSINESS_ACCOUNT_ID)%'
            webhook_verify_token: '%env(default::WHATSAPP_WEBHOOK_VERIFY_TOKEN)%'
            timeout: 10.0
            connect_timeout: 5.0
            # Unsigned mock webhooks only while kernel.debug is on; the bundle refuses them otherwise
            # (no app_secret here), so APP_ENV=prod / APP_DEBUG=0 keeps compiling with signature checks on.
            allow_unsigned_webhooks: '%kernel.debug%'
